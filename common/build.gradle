
plugins {
    id 'java'
    id 'maven-publish'
    id "fabric-loom" version "$fabric_loom_version"
}

base {
    archivesName = "${mod_id}-common"
}

dependencies {
    minecraft "com.mojang:minecraft:${minecraft_version}"
    mappings loom.layered() {
        officialMojangMappings()
        parchment("org.parchmentmc.data:parchment-${parchment_mc_version}:${parchment_version}@zip")
    }

    compileOnly "org.spongepowered:mixin:0.8.5"

    api("fuzs.forgeconfigapiport:forgeconfigapiport-common-neoforgeapi:${forgeconfig_api_port_version}")
}

loom {
    accessWidenerPath.set(project.file("src/main/resources/customadvancements.accesswidener"))

    mixin {
        defaultRefmapName.set("${mod_id}.refmap.json")
    }
}

publishing {
    publications {
        mavenJava(MavenPublication) {
            artifactId base.archivesName.get()
            from components.java
        }
    }
    repositories {
        maven {
            url "file://" + System.getenv("local_maven")
        }
    }
}

jar {
    from project(":mc_libs").sourceSets.main.output.classesDirs
    duplicatesStrategy = DuplicatesStrategy.EXCLUDE
}

tasks.named("sourcesJar", Jar) {
    from(project(":mc_libs").sourceSets.main.allSource)
}

sourceSets {
    main {
        resources {
            srcDir 'src/generated/resources'
        }
    }
}
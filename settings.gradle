pluginManagement {
    repositories {
        gradlePluginPortal()

        maven {
            name = 'Sponge / Mixin'
            url = 'https://repo.spongepowered.org/repository/maven-public/'
        }
        maven {
            name = 'Fabric'
            url = 'https://maven.fabricmc.net/'
        }
        maven {
            name = 'NeoForge'
            url = 'https://maven.neoforged.net/releases/'
        }
    }
}

plugins {
    id 'org.gradle.toolchains.foojay-resolver-convention' version '0.8.0'
}

rootProject.name = 'customadvancements'
include('common')
include('fabric')
include('neoforge')

include ':mc_libs'
project(':mc_libs').projectDir = file('../mc_libs')

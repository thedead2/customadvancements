ext.awFile = project(":common").file("src/main/resources/customadvancements.accesswidener")
ext.atFile = file("src/main/resources/META-INF/accesstransformer.cfg")

// Automatically translate accesswidener entries of the common module for neoforge's accesstransformer so I don't have to do it manually!
tasks.register('generateAccessTransformers') {
    group = 'mod setup'
    description = 'Translates Fabric accesswidener to NeoForge accesstransformer'

    inputs.file(awFile)
    outputs.file(atFile)

    doLast {
        if (!awFile.exists()) {
            println "No accesswidener file found in common module!"
            return
        }

        def awLines = awFile.readLines()
        def atLines = [
                "# This file gets AUTOMATICALLY generated by gradle!",
                "# Changes will be overwritten with the next build.",
                "# Please apply changes to the accesswidener file in the common module.",
                ""
        ]

        for (String line : awLines) {
            line = line.trim()

            if (line.isEmpty() || line.startsWith("#") || line.startsWith("accessWidener")) {
                continue
            }

            def parts = line.split("\\s+")
            if (parts.length < 3) continue

            def modifier = parts[0] // accessible, mutable
            def type = parts[1] // class, field, method
            // NeoForge uses dots instead of slashes
            def owner = parts[2].replace('/', '.')

            if (type == "class") {
                atLines.add("public ${owner}")
            }
            else if (type == "field") {
                def name = parts[3]
                // "mutable" --> "public-f"
                def prefix = (modifier == "mutable") ? "public-f" : "public"
                atLines.add("${prefix} ${owner} ${name}")
            }
            else if (type == "method") {
                def name = parts[3]
                def desc = parts[4]
                // Keep slashes for parameters!
                atLines.add("public ${owner} ${name}${desc}")
            }
        }

        atFile.parentFile.mkdirs()
        atFile.text = atLines.join("\n")
        println "accesstransformer.cfg generated successfully!"
    }
}
def atFile = file("src/main/resources/META-INF/accesstransformer.cfg")

// Automatically translate accesswidener entries of the common module for neoforge's accesstransformer so I don't have to do it manually!
def generateAccessTransformers = tasks.register('generateAccessTransformers') {
    group = 'mod setup'
    description = 'Translates Fabric accesswidener to NeoForge accesstransformer'

    def awFile = project(":common").file("src/main/resources/customadvancements.accesswidener")
    //def atFile = file("src/main/resources/META-INF/accesstransformer.cfg")

    inputs.file(awFile)
    outputs.file(atFile)

    doLast {
        if (!awFile.exists()) {
            println "No accesswidener file found in common module!"
            return
        }

        def awLines = awFile.readLines()
        def atLines = [
                "# This file gets AUTOMATICALLY generated by gradle!",
                "# Changes will be overwritten with the next build.",
                "# Please apply changes to the customadvancements.accesswidener file in the common module.",
                ""
        ]

        for (String line : awLines) {
            line = line.trim()

            if (line.isEmpty() || line.startsWith("#") || line.startsWith("accessWidener")) {
                continue
            }

            def parts = line.split("\\s+")
            if (parts.length < 3) continue

            def modifier = parts[0] // accessible, mutable
            def type = parts[1] // class, field, method
            // NeoForge uses dots instead of slashes
            def owner = parts[2].replace('/', '.')

            if (type == "class") {
                atLines.add("public ${owner}")
            }
            else if (type == "field") {
                def name = parts[3]
                // "mutable" --> "public-f"
                def prefix = (modifier == "mutable") ? "public-f" : "public"
                atLines.add("${prefix} ${owner} ${name}")
            }
            else if (type == "method") {
                def name = parts[3]
                def desc = parts[4]
                // IMPORTANT: Keep slashes for parameters!
                atLines.add("public ${owner} ${name}${desc}")
            }
        }

        atFile.parentFile.mkdirs()
        atFile.text = atLines.join("\n")
        println "accesstransformer.cfg generated successfully!"
    }
}


neoForge {
    version = "${neoforge_version}"

    parchment {
        minecraftVersion = "${parchment_mc_version}"
        mappingsVersion = "${parchment_version}"
    }

    accessTransformers {
        //file('src/main/resources/META-INF/accesstransformer.cfg')
        file(atFile)
    }


    runs {
        client {
            client()
            systemProperty 'neoforge.enabledGameTestNamespaces', project.mod_id
            systemProperty 'terminal.ansi', 'true'

            logLevel = org.slf4j.event.Level.DEBUG

            gameDirectory = project.file("run/client")
        }
        server {
            server()
            programArgument '--nogui'
            systemProperty 'neoforge.enabledGameTestNamespaces', project.mod_id
            systemProperty 'terminal.ansi', 'true'

            logLevel = org.slf4j.event.Level.DEBUG

            gameDirectory = project.file("run/server")
        }
        data {
            data()

            systemProperty 'terminal.ansi', 'true'
            logLevel = org.slf4j.event.Level.DEBUG

            def commonGeneratedDir = rootProject.file('common/src/generated/resources')

            programArguments.addAll '--mod', "${mod_id}",
                    '--output', commonGeneratedDir.getAbsolutePath(),
                    '--all'
        }
    }

    mods {
        "${mod_id}" {
            sourceSet sourceSets.main
            sourceSet project(":common").sourceSets.main
            sourceSet project(":mc_libs").sourceSets.main
        }
    }
}

dependencies {
    compileOnly project(path: ":common", configuration: "namedElements")
}

// Exclude Fabric Loader from NeoForge
configurations {
    compileClasspath { exclude group: 'net.fabricmc', module: 'fabric-loader' }
    runtimeClasspath { exclude group: 'net.fabricmc', module: 'fabric-loader' }
}

tasks.named('processResources') {
    dependsOn tasks.named('generateAccessTransformers')
}

tasks.named('sourcesJar') {
    dependsOn tasks.named('generateAccessTransformers')
}

tasks.named('createMinecraftArtifacts') {
    dependsOn tasks.named('generateAccessTransformers')
}

tasks.withType(JavaExec).configureEach {
    dependsOn tasks.named('processResources')
}